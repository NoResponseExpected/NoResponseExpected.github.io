body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem;}

<script>
(function(){
"use strict";

var Qs=[

{topic:"Capacitors \u2014 Charging",
q:"A 100\u00a0\u03bcF capacitor is charged through a 50\u00a0k\u03a9 resistor from a 12\u00a0V supply (initially uncharged). The time constant is 5.0\u00a0s. What is the voltage across the capacitor after 5.0\u00a0s?",
opts:["4.4\u00a0V","7.6\u00a0V","8.8\u00a0V","12\u00a0V"],
ans:1,
explain:"For a charging capacitor: V = V\u2080(1 \u2212 e\u207b\u1d57\u02b2\u1d57). At t = \u03c4 = 5.0\u00a0s: V = 12(1 \u2212 e\u207b\u00b9) = 12 \u00d7 0.632 = 7.6\u00a0V. The trap answer 4.4\u00a0V comes from using the discharge formula V = V\u2080e\u207b\u1d57\u02b2\u1d57 = 12 \u00d7 0.368 \u2014 which gives the voltage across the resistor, not the capacitor. Always identify whether the capacitor is charging or discharging before choosing your formula."},

{topic:"Quantum Physics \u2014 Photoelectric Effect",
q:"Light of wavelength 200\u00a0nm is incident on a metal surface with work function 3.5\u00a0eV. What is the stopping potential required to halt all emitted photoelectrons?",
data:"h = 6.63\u00d710\u207b\u00b3\u2074\u00a0J\u00a0s, c = 3.0\u00d710\u2078\u00a0m\u00a0s\u207b\u00b9, 1\u00a0eV = 1.6\u00d710\u207b\u00b9\u2079\u00a0J",
opts:["1.75\u00a0V","2.72\u00a0V","3.50\u00a0V","6.22\u00a0V"],
ans:1,
explain:"E = hc/\u03bb = (6.63\u00d710\u207b\u00b3\u2074 \u00d7 3.0\u00d710\u2078) / (200\u00d710\u207b\u2079) = 9.95\u00d710\u207b\u00b9\u2079\u00a0J = 6.22\u00a0eV. KE\u2098\u2090\u02e3 = hf \u2212 \u03d5 = 6.22 \u2212 3.50 = 2.72\u00a0eV. Stopping potential = KE\u2098\u2090\u02e3/e = 2.72\u00a0V. The trap 6.22\u00a0V is the photon energy in eV; the trap 3.50\u00a0V is the work function. The stopping potential equals only the excess kinetic energy, not the full photon energy."},

{topic:"Simple Harmonic Motion \u2014 Energy",
q:"A mass oscillates with SHM of amplitude A and spring constant k. What fraction of the total energy is kinetic energy when the displacement is A/2?",
opts:["1/4","1/2","3/4","1/\u221a2"],
ans:2,
explain:"E\u209c\u2092\u209c\u2090\u2097 = \u00bdkA\u00b2. At x = A/2: E\u209a\u2091 = \u00bdk(A/2)\u00b2 = \u00bdkA\u00b2/4 = E\u209c\u2092\u209c\u2090\u2097/4. Therefore E\u2096 = E\u209c\u2092\u209c\u2090\u2097 \u2212 E\u209a\u2091 = \u00be E\u209c\u2092\u209c\u2090\u2097. The kinetic fraction is 3/4. A common error is thinking \u2018half displacement means half energy\u2019 \u2014 but PE depends on x\u00b2, so halving displacement quarters the PE, leaving 3/4 as KE."},

{topic:"Waves \u2014 Diffraction Grating",
q:"Monochromatic light of wavelength 600\u00a0nm is incident on a diffraction grating with slit spacing 1.5\u00a0\u03bcm. What is the highest order of diffraction that can be observed?",
opts:["1","2","3","5"],
ans:1,
explain:"Maximum order when sin\u03b8 = 1: n\u2098\u2090\u02e3 = d/\u03bb = 1.5\u00d710\u207b\u2076 / 600\u00d710\u207b\u2079 = 2.5. Since n must be an integer and sin\u03b8 \u2264 1, the maximum observable order is n = 2. The n = 3 order would require sin\u03b8 = 1.2 > 1, which is physically impossible. Students often round 2.5 up to 3, forgetting the sinusoidal constraint."},

{topic:"Gravitational Fields",
q:"At Earth\u2019s surface the gravitational field strength is g. At what height above the surface does the field strength equal g/4? (R = radius of Earth)",
opts:["R/4","R/2","R","2R"],
ans:2,
explain:"g \u221d 1/r\u00b2. At height h: g/4 = g \u00d7 R\u00b2/(R+h)\u00b2 \u2192 (R+h)\u00b2 = 4R\u00b2 \u2192 R+h = 2R \u2192 h = R. The field is quartered at a distance of 2R from Earth\u2019s centre, i.e. one Earth radius above the surface. Students often forget that r is measured from the centre, not the surface, and give 2R as the altitude."},

{topic:"Electromagnetic Induction",
q:"A coil of 500 turns experiences a change in magnetic flux from 2.0\u00d710\u207b\u00b3\u00a0Wb to 8.0\u00d710\u207b\u00b3\u00a0Wb in 0.10\u00a0s. What is the magnitude of the induced EMF?",
opts:["0.030\u00a0V","3.0\u00a0V","30\u00a0V","300\u00a0V"],
ans:2,
explain:"\u03b5 = N \u00d7 \u0394\u03a6/\u0394t = 500 \u00d7 (8.0 \u2212 2.0)\u00d710\u207b\u00b3 / 0.10 = 500 \u00d7 6.0\u00d710\u207b\u00b3 / 0.10 = 500 \u00d7 0.060 = 30\u00a0V. Common errors: omitting the factor of N (giving 0.060\u00a0V), using the total flux rather than the change in flux, or inverting the time (giving 300\u00a0V). Always use \u0394\u03a6, not \u03a6\u1da0\u1da2\u2099\u2090\u2097."},

{topic:"Electric Fields \u2014 Potential",
q:"A charge of +3.0\u00a0\u03bcC is moved from a point at potential +400\u00a0V to a point at potential +100\u00a0V. How much work is done by the electric field on the charge?",
opts:["\u22129.0\u00d710\u207b\u2074\u00a0J","+9.0\u00d710\u207b\u2074\u00a0J","\u22121.5\u00d710\u207b\u00b3\u00a0J","+1.5\u00d710\u207b\u00b3\u00a0J"],
ans:1,
explain:"Work done by the field = q(V\u1da2 \u2212 V\u1da0) = 3.0\u00d710\u207b\u2076 \u00d7 (400 \u2212 100) = 3.0\u00d710\u207b\u2076 \u00d7 300 = +9.0\u00d710\u207b\u2074\u00a0J. Positive work is done because the positive charge moves in the direction the field pushes it \u2014 from high to low potential. The trap \u22129.0\u00d710\u207b\u2074\u00a0J confuses work done BY the field with work done AGAINST the field."},

{topic:"Materials \u2014 Young Modulus",
q:"A steel wire (radius 0.50\u00a0mm, length 2.0\u00a0m) extends by 2.0\u00a0mm under a load of 200\u00a0N. What is the Young modulus of the steel?",
opts:["1.3\u00d710\u00b9\u00b9\u00a0Pa","2.5\u00d710\u00b9\u00b9\u00a0Pa","5.1\u00d710\u00b9\u00b9\u00a0Pa","2.5\u00d710\u00b9\u00b2\u00a0Pa"],
ans:1,
explain:"A = \u03c0r\u00b2 = \u03c0 \u00d7 (0.50\u00d710\u207b\u00b3)\u00b2 = 7.85\u00d710\u207b\u2077\u00a0m\u00b2. Stress = F/A = 200 / 7.85\u00d710\u207b\u2077 = 2.55\u00d710\u2078\u00a0Pa. Strain = \u0394L/L = 2.0\u00d710\u207b\u00b3 / 2.0 = 1.0\u00d710\u207b\u00b3. E = stress/strain = 2.55\u00d710\u2078 / 1.0\u00d710\u207b\u00b3 = 2.5\u00d710\u00b9\u00b9\u00a0Pa. The most common error is using diameter instead of radius when calculating cross-sectional area, which gives an answer four times too small."},

{topic:"Capacitors \u2014 Series Circuits",
q:"Capacitors C\u2081 = 4.0\u00a0\u03bcF and C\u2082 = 12\u00a0\u03bcF are connected in series with a 12\u00a0V battery. What is the voltage across C\u2082?",
opts:["1.0\u00a0V","3.0\u00a0V","4.0\u00a0V","9.0\u00a0V"],
ans:1,
explain:"Series capacitance: 1/C = 1/4 + 1/12 = 4/12 \u2192 C = 3.0\u00a0\u03bcF. Charge Q = CV = 3.0 \u00d7 12 = 36\u00a0\u03bcC (same on both capacitors in series). V\u2082 = Q/C\u2082 = 36/12 = 3.0\u00a0V. The smaller capacitor takes the larger share of voltage: V\u2081 = 36/4 = 9.0\u00a0V. This is the opposite of resistors in series, where the larger resistor takes more voltage \u2014 a classic confusion."},

{topic:"Mechanics \u2014 Elastic Collisions",
q:"A 3.0\u00a0kg ball moving at 4.0\u00a0m/s collides elastically with a stationary 1.0\u00a0kg ball. What is the velocity of the 3.0\u00a0kg ball after the collision?",
opts:["0\u00a0m/s (stops)","1.0\u00a0m/s","2.0\u00a0m/s","3.0\u00a0m/s"],
ans:2,
explain:"For an elastic collision: v\u2081 = (m\u2081\u2212m\u2082)u\u2081/(m\u2081+m\u2082) = (3\u22121)\u00d74/(3+1) = 8/4 = 2.0\u00a0m/s. The heavier ball continues forward, slower. Also: v\u2082 = 2m\u2081u\u2081/(m\u2081+m\u2082) = 24/4 = 6.0\u00a0m/s for the lighter ball. Only in a collision between equal masses does the first ball stop \u2014 a common over-generalisation from Newton\u2019s cradle demonstrations."},

{topic:"Particles \u2014 Beta Decay",
q:"Which equation correctly represents beta-plus (\u03b2\u207a) decay of a proton?",
opts:["p \u2192 n + e\u207b + \u03bd\u0305\u2091","p \u2192 n + e\u207a + \u03bd\u2091","p \u2192 n + e\u207a + \u03bd\u0305\u2091","n \u2192 p + e\u207a + \u03bd\u2091"],
ans:1,
explain:"\u03b2\u207a decay: p \u2192 n + e\u207a + \u03bd\u2091. Check lepton number: 0 = 0 + (\u22121) + (+1) = 0. \u2714. A neutrino (not antineutrino) is produced because lepton number must be conserved \u2014 the positron has lepton number \u22121 so a particle with lepton number +1 (neutrino) must also appear. Option A describes \u03b2\u207b decay (neutron decay), not \u03b2\u207a."},

{topic:"Imaging \u2014 Digital Images",
q:"A digital camera produces images of 4000 \u00d7 3000 pixels, each pixel encoded with 24 bits of colour data. What is the uncompressed file size?",
opts:["12\u00a0MB","24\u00a0MB","36\u00a0MB","144\u00a0MB"],
ans:2,
explain:"Total pixels = 4000 \u00d7 3000 = 12\u00a0000\u00a0000. Total bits = 12\u00d710\u2076 \u00d7 24 = 288\u00d710\u2076\u00a0bits. Size in bytes = 288\u00d710\u2076 / 8 = 36\u00d710\u2076\u00a0bytes = 36\u00a0MB. The most common error is forgetting to divide by 8 to convert bits to bytes, giving 288\u00a0MB. Another trap: confusing \u201cpixels\u201d with \u201cbytes\u201d when 24-bit colour uses 3 bytes (RGB) per pixel."},

{topic:"Simple Harmonic Motion \u2014 Pendulum",
q:"A simple pendulum has period T on Earth (g = 9.81\u00a0m\u00a0s\u207b\u00b2). The Moon\u2019s gravitational field strength is 1.63\u00a0m\u00a0s\u207b\u00b2. What is the period of the same pendulum on the Moon?",
opts:["T/\u221a6","T/2.45","T \u00d7 2.45","T \u00d7 6"],
ans:2,
explain:"T = 2\u03c0\u221a(L/g), so T \u221d 1/\u221ag. T\u1d39\u2092\u2092\u207f/T\u1d3c\u2090\u02b3\u209c\u02b0 = \u221a(g\u1d3c\u2090\u02b3\u209c\u02b0/g\u1d39\u2092\u2092\u207f) = \u221a(9.81/1.63) = \u221a6.02 \u2248 2.45. The period on the Moon is 2.45T \u2014 much longer because the weaker gravity gives the pendulum a gentler restoring force. A common error is using T \u221d g (rather than 1/\u221ag), giving T/6."},

{topic:"Electricity \u2014 Transformers",
q:"A transformer has 200 primary turns and 800 secondary turns. The primary operates at 120\u00a0V with 4.0\u00a0A. The secondary delivers 0.90\u00a0A. What is the efficiency of the transformer?",
opts:["75%","82%","90%","96%"],
ans:2,
explain:"Ideal secondary voltage = V\u2081 \u00d7 N\u2082/N\u2081 = 120 \u00d7 800/200 = 480\u00a0V. P\u1da2\u207f = V\u2081I\u2081 = 120 \u00d7 4.0 = 480\u00a0W. P\u2092\u1d4a\u209c = V\u2082I\u2082 = 480 \u00d7 0.90 = 432\u00a0W. Efficiency = 432/480 = 0.90 = 90%. The trap is using the turns ratio directly without computing input and output power separately. Note: 432/480 \u2260 0.90/4.0."},

{topic:"Space and Time \u2014 Relativistic Energy",
q:"A particle has rest energy E\u2080. At what speed is its total energy exactly 2E\u2080?",
opts:["0.50c","0.71c","0.87c","0.94c"],
ans:2,
explain:"E\u209c\u2092\u209c\u2090\u2097 = \u03b3E\u2080 = 2E\u2080 \u2192 \u03b3 = 2. Then: 1/\u221a(1\u2212v\u00b2/c\u00b2) = 2 \u2192 1\u2212v\u00b2/c\u00b2 = 1/4 \u2192 v\u00b2/c\u00b2 = 3/4 \u2192 v = (\u221a3/2)c \u2248 0.866c \u2248 0.87c. The relativistic KE at this speed is E\u2080 (the rest energy) \u2014 so KE = rest energy. Students often try v = c/\u03b3 = c/2 = 0.50c, wrongly inverting the Lorentz factor."},

{topic:"Capacitors \u2014 Discharge Time",
q:"A 220\u00a0\u03bcF capacitor charged to 9.0\u00a0V discharges through an 82\u00a0k\u03a9 resistor (\u03c4 = 18\u00a0s). After what time has the voltage fallen to 3.0\u00a0V?",
opts:["6.0\u00a0s","12\u00a0s","18\u00a0s","20\u00a0s"],
ans:3,
explain:"V = V\u2080e\u207b\u1d57\u02b2\u1d57 \u2192 3.0 = 9.0 \u00d7 e\u207b\u1d57\u02b2\u00b9\u2078 \u2192 e\u207b\u1d57\u02b2\u00b9\u2078 = 1/3 \u2192 \u2212t/18 = ln(1/3) = \u2212ln(3) = \u22121.099 \u2192 t = 18 \u00d7 1.099 \u2248 20\u00a0s. The trap 18\u00a0s is exactly one time constant, but after \u03c4 the voltage is 9.0/e = 3.31\u00a0V, not 3.0\u00a0V. For a voltage ratio of exactly 1/3, you need t = \u03c4\u00a0ln\u00a03 \u2248 1.10\u03c4."},

{topic:"Imaging \u2014 Lens Power",
q:"Two thin converging lenses of focal lengths 20\u00a0cm and 25\u00a0cm are placed in contact. What is the focal length of the combination?",
opts:["9.1\u00a0cm","11\u00a0cm","22.5\u00a0cm","45\u00a0cm"],
ans:1,
explain:"Add powers: P = P\u2081 + P\u2082 = 1/0.20 + 1/0.25 = 5.0 + 4.0 = 9.0\u00a0D. Focal length = 1/P = 1/9.0 = 0.111\u00a0m = 11\u00a0cm. Students often average the focal lengths (giving 22.5\u00a0cm) or add focal lengths directly (giving 45\u00a0cm). It is the powers (diopters), not the focal lengths, that add for thin lenses in contact."},

{topic:"Medical Physics \u2014 Radiation Dose",
q:"A radiotherapy patient receives 40\u00a0mGy from slow neutrons (quality factor Q = 10) and 30\u00a0mGy from \u03b3-rays (Q = 1). What is the total effective dose?",
opts:["70\u00a0mSv","340\u00a0mSv","430\u00a0mSv","700\u00a0mSv"],
ans:2,
explain:"Effective dose (Sv) = absorbed dose (Gy) \u00d7 quality factor Q. Total = (40 \u00d7 10) + (30 \u00d7 1) = 400 + 30 = 430\u00a0mSv. The trap 70\u00a0mSv comes from adding the absorbed doses directly, ignoring Q. Neutrons are far more biologically damaging per unit absorbed energy than \u03b3-rays, which is what Q quantifies."},

{topic:"Waves \u2014 Refraction",
q:"A ray travels from medium A (n = 1.0) into medium B (n = 1.5), then into medium C (n = 1.2). The angle of incidence in A is 45\u00b0. What is the angle of refraction in C?",
opts:["22\u00b0","28\u00b0","36\u00b0","45\u00b0"],
ans:2,
explain:"Snell\u2019s law at each boundary: n\u2090\u00a0sin\u03b8\u2090 = n\u0299\u00a0sin\u03b8\u0299 = n\u1d9c\u00a0sin\u03b8\u1d9c. Since the first and last expressions are equal, the intermediate medium cancels: 1.0 \u00d7 sin45\u00b0 = 1.2 \u00d7 sin\u03b8\u1d9c. sin\u03b8\u1d9c = 0.7071/1.2 = 0.589 \u2192 \u03b8\u1d9c = 36\u00b0. A key insight is that intermediate layers do not affect the final angle \u2014 only the first and last media matter. Students who apply Snell\u2019s law to the first boundary only, then forget to apply it to the second, often choose 28\u00b0."},

{topic:"Simple Harmonic Motion \u2014 Equations",
q:"The displacement of an oscillator is x = 0.040\u00a0sin(2\u03c0t)\u00a0m, where t is in seconds. At what time (t > 0) does the oscillator first reach x = +0.020\u00a0m?",
opts:["0.083\u00a0s","0.17\u00a0s","0.25\u00a0s","0.50\u00a0s"],
ans:0,
explain:"0.020 = 0.040\u00a0sin(2\u03c0t) \u2192 sin(2\u03c0t) = 0.5 \u2192 2\u03c0t = \u03c0/6 (first positive solution) \u2192 t = 1/12 \u2248 0.083\u00a0s. A common error is using t = 0.25\u00a0s (quarter period), which gives the amplitude, not x = A/2. The amplitude is reached at 2\u03c0t = \u03c0/2, i.e. t = 0.25\u00a0s."},

{topic:"Mechanics \u2014 Elastic Collisions",
q:"A ball of mass m moving at speed u collides elastically head-on with an identical stationary ball. What is the outcome?",
opts:["Both balls move at u/2","The first ball stops; the second moves at u","Both balls move at u/\u221a2","The first ball bounces back at u; the second remains stationary"],
ans:1,
explain:"For an elastic collision between equal masses: v\u2081 = (m\u2212m)u/(m+m) = 0 and v\u2082 = 2mu/(m+m) = u. The first ball stops completely and the second moves at the original speed \u2014 exactly like Newton\u2019s cradle. Students often suggest both balls share the momentum (both at u/2), which would conserve momentum but not kinetic energy."},

{topic:"Radioactivity \u2014 Carbon Dating",
q:"A sample of ancient wood has 25% of the C-14 activity of a living tree. Given the half-life of C-14 is 5730 years, what is the age of the sample?",
opts:["2865 years","5730 years","11\u00a0460 years","22\u00a0920 years"],
ans:2,
explain:"Activity \u221d number of C-14 nuclei. 25% = (1/2)\u00b2 \u2192 two half-lives have elapsed. Age = 2 \u00d7 5730 = 11\u00a0460 years. Students sometimes use A = A\u2080e\u207b\u03bbt and attempt a logarithm, which works but is slower. Recognising that 25% = (1/4) = (1/2)\u00b2 directly gives two half-lives without calculation."},

{topic:"Signalling \u2014 Signal-to-Noise Bits",
q:"An analogue signal occupies a voltage range of 4.0\u00a0V. The noise level is 0.040\u00a0V. What is the minimum number of bits required so that the quantisation levels are no larger than the noise?",
opts:["6","7","8","10"],
ans:1,
explain:"b = log\u2082(V\u209c\u2092\u209c\u2090\u2097/V\u2099\u2092\u1da2\u209b\u1d49) = log\u2082(4.0/0.040) = log\u2082(100) = 6.64. Since b must be a whole number and we need at least 6.64 bits, we round up to 7 bits. 6 bits gives only 64 levels over 4\u00a0V = 62.5\u00a0mV per level, which is coarser than the 40\u00a0mV noise. 7 bits gives 128 levels = 31.25\u00a0mV per level, which is finer than the noise. Always round up, never down."},

{topic:"Space and Time \u2014 Relativistic Energy",
q:"A particle has rest mass energy 500\u00a0MeV. Its total energy is measured as 1500\u00a0MeV. What is its speed?",
opts:["0.50c","0.75c","0.87c","0.94c"],
ans:3,
explain:"\u03b3 = E\u209c\u2092\u209c\u2090\u2097/E\u2080 = 1500/500 = 3. Then: 1/\u221a(1\u2212v\u00b2/c\u00b2) = 3 \u2192 1\u2212v\u00b2/c\u00b2 = 1/9 \u2192 v\u00b2/c\u00b2 = 8/9 \u2192 v = c\u221a(8/9) = 2\u221a2c/3 \u2248 0.943c. Note that its kinetic energy = total \u2212 rest = 1500 \u2212 500 = 1000\u00a0MeV = 2E\u2080 (twice the rest energy). Students who use \u03b3 = v/c make a fundamental error \u2014 \u03b3 is not v/c."},

{topic:"Capacitors \u2014 Plates",
q:"A parallel-plate capacitor is connected to a battery and fully charged. The battery remains connected while the plate separation is doubled. Which statement correctly describes what happens?",
opts:["Charge halves; voltage halves; energy halves","Charge halves; voltage stays the same; energy halves","Charge stays the same; voltage doubles; energy doubles","Charge doubles; voltage stays the same; energy doubles"],
ans:1,
explain:"With the battery connected, voltage V is fixed. Doubling plate separation halves capacitance (C = \u03b5\u2080A/d). Since Q = CV and V is fixed, Q halves. Energy E = \u00bdCV\u00b2 also halves (C halved, V fixed). Contrast this with the disconnected-battery case (where Q is fixed and energy doubles). The key is always to identify whether V or Q is the constrained quantity."},

{topic:"Waves \u2014 Phasors",
q:"Two waves travel along the same medium: y\u2081 = 3.0\u00a0sin(\u03c9t)\u00a0cm and y\u2082 = 4.0\u00a0sin(\u03c9t + \u03c0/2)\u00a0cm. What is the amplitude of the resultant wave?",
opts:["1.0\u00a0cm","3.5\u00a0cm","5.0\u00a0cm","7.0\u00a0cm"],
ans:2,
explain:"The waves are 90\u00b0 out of phase. Using phasor addition (Pythagoras): A = \u221a(3.0\u00b2 + 4.0\u00b2) = \u221a(9 + 16) = \u221a25 = 5.0\u00a0cm. This is only valid because the phase difference is 90\u00b0. For 0\u00b0 phase difference the result would be 7.0\u00a0cm (constructive); for 180\u00b0 it would be 1.0\u00a0cm (destructive). Phasor addition is a core OCR B skill."},

{topic:"Mechanics \u2014 Escape Velocity",
q:"An object is launched from Earth\u2019s surface at exactly the escape velocity. What is its total mechanical energy (KE + GPE)?",
opts:["Positive \u2014 it has surplus energy","Zero \u2014 it just reaches infinity at rest","Negative \u2014 it cannot actually escape","It depends on the mass of the object"],
ans:1,
explain:"Escape velocity is defined as the minimum speed to reach infinity. At this speed, the object arrives at infinity with exactly zero KE. GPE at infinity = 0. Therefore total energy at infinity = 0 + 0 = 0. Since energy is conserved, total energy at the surface is also zero: \u00bdmv\u1d49\u209b\u1d9c\u00b2 \u2212 GMm/R = 0. Objects with total energy < 0 are bound (cannot escape); > 0 would overshoot. This is why escape velocity requires E\u209c\u2092\u209c\u2090\u2097 = 0, not positive."},

{topic:"Sensing \u2014 Resistivity",
q:"A copper wire has resistance 5.0\u00a0\u03a9 at 20\u00b0C. The temperature coefficient of resistance for copper is \u03b1 = 3.9\u00d710\u207b\u00b3\u00a0K\u207b\u00b9. What is its resistance at 120\u00b0C?",
opts:["5.2\u00a0\u03a9","6.0\u00a0\u03a9","6.95\u00a0\u03a9","7.5\u00a0\u03a9"],
ans:2,
explain:"R = R\u2080(1 + \u03b1\u0394T) = 5.0 \u00d7 (1 + 3.9\u00d710\u207b\u00b3 \u00d7 100) = 5.0 \u00d7 (1 + 0.39) = 5.0 \u00d7 1.39 = 6.95\u00a0\u03a9. Note \u0394T = 120 \u2212 20 = 100\u00a0K, not 120\u00a0K \u2014 using 120\u00a0K gives 7.34\u00a0\u03a9 and is a common error. This formula applies to metals where resistance increases linearly with temperature."},

{topic:"Electromagnetic Induction \u2014 Lenz\u2019s Law",
q:"A horizontal conducting ring falls towards a horizontal bar magnet (north pole facing up). As the ring approaches, the induced current in the ring, viewed from above, flows:",
opts:["Clockwise, creating a south pole facing the magnet","Anticlockwise, creating a north pole facing the magnet","Clockwise, creating a north pole facing the magnet","There is no induced current as the ring moves parallel to the field"],
ans:1,
explain:"By Lenz\u2019s law, the induced current must oppose the increase in upward flux through the ring. The induced current must therefore create a magnetic field opposing the magnet\u2019s field (i.e. a downward field through the ring, opposing the upward field of the north pole). Using the right-hand rule, a downward field through the ring requires an anticlockwise current viewed from above. This also creates a north pole facing downward, repelling the approaching magnet."},

{topic:"Waves \u2014 Interference",
q:"In a double-slit experiment, the fringe separation is w. The entire apparatus is then submerged in water (refractive index n = 1.33). The fringe spacing becomes:",
opts:["nw = 1.33w","w/n = 0.75w","w","w\u221an = 1.15w"],
ans:1,
explain:"Fringe spacing w = \u03bbD/d. In water, the wavelength decreases: \u03bb\u1d68\u2090\u209c\u1d49\u02b3 = \u03bb\u2090\u1da2\u02b3/n. The slit separation d and screen distance D are unchanged. So w\u1d68\u2090\u209c\u1d49\u02b3 = \u03bb\u2090\u1da2\u02b3D/(nd) = w/n = w/1.33 \u2248 0.75w. The fringes become closer together because the wavelength (and therefore the path difference per fringe) is reduced. Students who forget that wavelength changes with medium, or who use v = f\u03bb incorrectly, often think the pattern is unchanged."}

];

var current=0,score=0,answers=[];
for(var k=0;k<Qs.length;k++) answers.push(null);

var quizArea=document.getElementById("quiz-area");
var resultsArea=document.getElementById("results-area");
var progBar=document.getElementById("prog");
var progLabel=document.getElementById("prog-label");
var scorePill=document.getElementById("score-pill");

document.addEventListener("click",function(e){
  var t=e.target;
  while(t&&t!==document){var a=t.getAttribute("data-action");if(a)break;t=t.parentElement;}
  if(!t||!t.getAttribute)return;
  var action=t.getAttribute("data-action");
  if(action==="choose"){handleChoice(parseInt(t.getAttribute("data-idx"),10));}
  else if(action==="prev"){if(current>0){current--;renderQ();}}
  else if(action==="next"){if(current<Qs.length){current++;renderQ();}}
  else if(action==="jump"){resultsArea.innerHTML="";current=parseInt(t.getAttribute("data-to"),10);renderQ();}
  else if(action==="restart"){for(var i=0;i<answers.length;i++)answers[i]=null;score=0;current=0;resultsArea.innerHTML="";renderQ();}
},false);

function handleChoice(idx){
  if(answers[current]!==null)return;
  answers[current]=idx;
  if(idx===Qs[current].ans)score++;
  updateMeta();renderQ();
}

function updateMeta(){
  var done=0;for(var i=0;i<answers.length;i++)if(answers[i]!==null)done++;
  progBar.style.width=(done/Qs.length*100)+"%";
  progLabel.textContent=current<Qs.length?"Question "+(current+1)+" of "+Qs.length:"Complete!";
  scorePill.textContent="Score: "+score+" / "+done;
}

function renderQ(){
  updateMeta();
  if(current>=Qs.length){renderResults();return;}
  var q=Qs[current];
  var answered=answers[current]!==null;
  var L=["A","B","C","D"];
  var opts="";
  for(var i=0;i<q.opts.length;i++){
    var cls="opt";
    if(answered){if(i===q.ans)cls+=" correct";else if(i===answers[current])cls+=" wrong";else cls+=" dimmed";}
    opts+="<button class='"+cls+"' data-action='choose' data-idx='"+i+"'"+(answered?" disabled":"")+">"
         +"<span class='opt-letter'>"+L[i]+"</span><span>"+q.opts[i]+"</span></button>";
  }
  var fb="";
  if(answered){
    var ok=answers[current]===q.ans;
    fb="<div class='feedback "+(ok?"fb-correct":"fb-wrong")+"'><div class='fb-head'>"+(ok?"\u2713 Correct":"\u2717 Incorrect")+"</div><div>"+q.explain+"</div></div>";
  }
  var dataBox=q.data?"<span class='q-data'>"+q.data+"</span>":"";
  var nxt=current<Qs.length-1
    ?"<button class='nav-btn primary' data-action='next'>Next \u2192</button>"
    :"<button class='nav-btn primary' data-action='next'>Finish \u2713</button>";
  quizArea.innerHTML=
    "<div class='topic-tag'>"+q.topic+"</div>"
   +"<div class='q-text'><strong>Q"+(current+1)+".</strong> "+q.q+"</div>"
   +dataBox
   +"<div class='options'>"+opts+"</div>"
   +fb
   +"<div class='nav'>"
   +"<button class='nav-btn' data-action='prev'"+(current===0?" disabled":"")+">\u2190 Previous</button>"
   +"<span class='q-counter'>"+(current+1)+" / "+Qs.length+"</span>"
   +nxt+"</div>";
}

function renderResults(){
  quizArea.innerHTML="";
  var pct=Math.round(score/Qs.length*100);
  var grade,col;
  if(pct>=80){grade="Exceptional \u2014 A* territory";col="var(--green)";}
  else if(pct>=65){grade="Strong \u2014 A/B range";col="var(--green)";}
  else if(pct>=50){grade="Solid \u2014 B/C range";col="var(--amber)";}
  else if(pct>=35){grade="Keep pushing \u2014 C/D range";col="var(--amber)";}
  else{grade="These are hard \u2014 keep revising!";col="var(--red)";}
  var dots="";
  for(var i=0;i<Qs.length;i++){
    var a=answers[i];
    var cls=a===null?"u":a===Qs[i].ans?"c":"w";
    dots+="<button class='dot "+cls+"' data-action='jump' data-to='"+i+"' title='Q"+(i+1)+": "+Qs[i].topic+"'>"+(i+1)+"</button>";
  }
  resultsArea.innerHTML=
    "<div class='results'>"
   +"<div class='results-score'>"+score+"<span>/"+Qs.length+"</span></div>"
   +"<div class='results-pct'>"+pct+"% correct</div>"
   +"<div class='results-grade' style='color:"+col+"'>"+grade+"</div>"
   +"<div class='breakdown'>"
   +"<div class='bd-card'><div class='bd-val green'>"+score+"</div><div class='bd-lbl'>Correct</div></div>"
   +"<div class='bd-card'><div class='bd-val red'>"+(Qs.length-score)+"</div><div class='bd-lbl'>Incorrect</div></div>"
   +"<div class='bd-card'><div class='bd-val'>"+pct+"%</div><div class='bd-lbl'>Score</div></div>"
   +"</div>"
   +"<div class='legend'>"
   +"<div class='legend-item'><div class='legend-dot' style='background:var(--green)'></div>Correct</div>"
   +"<div class='legend-item'><div class='legend-dot' style='background:var(--red)'></div>Incorrect</div>"
   +"</div>"
   +"<div class='dot-hint'>Tap any dot to review that question</div>"
   +"<div class='dot-row'>"+dots+"</div>"
   +"<button class='restart-btn' data-action='restart'>Try Again</button>"
   +"</div>";
  progBar.style.width="100%";progLabel.textContent="Complete!";
}

renderQ();
}());
</script>
