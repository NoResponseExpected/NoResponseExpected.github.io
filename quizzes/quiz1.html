<script>
(function(){
"use strict";
 
var Qs=[
{topic:"Mechanics",q:"A car decelerates uniformly from 20\u00a0m/s to rest in 4.0\u00a0s. What is the total distance travelled?",opts:["80\u00a0m","40\u00a0m","20\u00a0m","10\u00a0m"],ans:1,explain:"Use s\u00a0=\u00a0\u00bd(u+v)t\u00a0=\u00a0\u00bd\u00a0\u00d7\u00a0(20+0)\u00a0\u00d7\u00a04\u00a0=\u00a040\u00a0m. A common error is s\u00a0=\u00a0u\u00a0\u00d7\u00a0t\u00a0=\u00a080\u00a0m, which ignores the deceleration and assumes constant speed throughout."},
{topic:"Mechanics",q:"A ball is thrown vertically upward. Which statement correctly describes it at its highest point?",opts:["Velocity and acceleration are both zero","Velocity is zero; acceleration is 9.81\u00a0m/s\u00b2 downward","Velocity is zero; acceleration is 9.81\u00a0m/s\u00b2 upward","Both velocity and acceleration are non-zero"],ans:1,explain:"Gravity acts continuously \u2014 it does not switch off at the top. The ball momentarily has zero velocity but g still provides a downward acceleration of 9.81\u00a0m/s\u00b2. This is one of the most common misconceptions in A-level mechanics."},
{topic:"Electricity",q:"A wire of resistance R is cut into two equal halves which are then connected in parallel. What is the new total resistance?",opts:["R/4","R/2","R","2R"],ans:0,explain:"Each half has resistance R/2. Two R/2 resistors in parallel: 1/R_total\u00a0=\u00a02\u00a0\u00f7\u00a0(R/2)\u00a0=\u00a04/R, so R_total\u00a0=\u00a0R/4. Many students forget that cutting the wire first halves each piece\u2019s resistance before applying the parallel formula."},
{topic:"Mechanics",q:"A car travels 60\u00a0km at 60\u00a0km/h, then a further 60\u00a0km at 120\u00a0km/h. What is the average speed for the whole journey?",opts:["90\u00a0km/h","85\u00a0km/h","80\u00a0km/h","75\u00a0km/h"],ans:2,explain:"Average speed = total distance / total time = 120 / (1 + 0.5) = 80\u00a0km/h. The trap is averaging the speeds: (60+120)/2 = 90\u00a0km/h \u2014 that only works when equal times, not equal distances, are spent at each speed."},
{topic:"Waves",q:"When light travels from air into glass, which quantity does NOT change?",opts:["Speed","Wavelength","Frequency","Direction"],ans:2,explain:"Frequency is set by the source and is unchanged at any boundary. Speed and wavelength both decrease (v\u00a0=\u00a0f\u03bb, f constant). Direction changes unless incidence is normal. Students frequently confuse frequency with wavelength here."},
{topic:"Quantum & Nuclear",q:"In the photoelectric effect, the intensity of light (above threshold frequency) is doubled. What is the effect on the emitted photoelectrons?",opts:["Maximum kinetic energy doubles","Stopping potential doubles","Number emitted per second doubles","Work function halves"],ans:2,explain:"Intensity determines the photon flux, hence the number of photoelectrons per second. Each individual photon\u2019s energy (E\u00a0=\u00a0hf) is unchanged, so maximum KE and stopping potential are unaffected. The work function is a fixed property of the metal."},
{topic:"Electricity",q:"A battery of EMF 12\u00a0V and internal resistance 2\u00a0\u03a9 is connected to a 10\u00a0\u03a9 external resistor. What is the terminal voltage?",opts:["12\u00a0V","10\u00a0V","8\u00a0V","6\u00a0V"],ans:1,explain:"I = 12 / (10+2) = 1.0\u00a0A. Terminal voltage = EMF \u2212 Ir = 12 \u2212 2 = 10\u00a0V. A common error is quoting the full EMF as the terminal voltage, ignoring the internal resistance drop."},
{topic:"Mechanics",q:"A body moves at constant speed in a horizontal circle. Which statement is correct?",opts:["No net force acts on the body","The body is in equilibrium","The body\u2019s velocity is constant","The body is accelerating"],ans:3,explain:"Velocity is a vector \u2014 changing direction at constant speed still means changing velocity, hence centripetal acceleration. Equilibrium requires zero net force; circular motion requires a centripetal force directed inward."},
{topic:"Electricity",q:"A 100\u00a0W light bulb is operated from a 230\u00a0V supply. What is its resistance?",opts:["2.3\u00a0\u03a9","23.0\u00a0\u03a9","43.5\u00a0\u03a9","529\u00a0\u03a9"],ans:3,explain:"R = V\u00b2/P = 230\u00b2/100 = 529\u00a0\u03a9. The common trap is inverting the formula to R = P/V\u00b2, giving a tiny implausible result. Always sanity-check your answer."},
{topic:"Quantum & Nuclear",q:"A nucleus of \u00b2\u00b3\u2078\u2089\u2082U undergoes alpha decay. Which nucleus is produced?",opts:["\u00b2\u00b3\u2074\u2089\u2070Th","\u00b2\u00b3\u2074\u2089\u2082U","\u00b2\u00b3\u2076\u2089\u2070Th","\u00b2\u00b3\u2078\u2089\u2070Th"],ans:0,explain:"An alpha particle is \u00b2\u2074He. Mass number: 238\u22124 = 234. Proton number: 92\u22122 = 90 (Thorium). Product is \u00b2\u00b3\u2074\u2089\u2070Th."},
{topic:"Mechanics",q:"A wire obeys Hooke\u2019s law. The load is doubled (within the elastic limit). By what factor does the elastic potential energy stored change?",opts:["\u00d71 (unchanged)","\u00d72","\u00d73","\u00d74"],ans:3,explain:"E = \u00bdFx and x\u00a0\u221d\u00a0F, so doubling F also doubles x. E\u2019 = \u00bd(2F)(2x) = 4\u00bdFx. Energy quadruples. Students often assume doubling force merely doubles energy, forgetting extension also doubles."},
{topic:"Waves",q:"A stationary wave is set up on a string. Which statement is correct?",opts:["All points vibrate with the same amplitude","Energy is transferred along the string","Points between two adjacent nodes vibrate in phase","Nodes and antinodes travel along the string"],ans:2,explain:"Between two consecutive nodes all points reach maximum displacement simultaneously \u2014 they are in phase, though with different amplitudes. Stationary waves store energy rather than transferring it. Nodes and antinodes are fixed in position."},
{topic:"Electricity",q:"An electron and a proton are each accelerated from rest through the same potential difference. Which statement is correct?",opts:["The proton gains more kinetic energy","The electron gains more kinetic energy","They gain equal kinetic energy","The proton gains more momentum"],ans:2,explain:"KE gained = qV. Both particles carry the same magnitude of charge (1.6\u00d710\u207b\u00b9\u2079\u00a0C), so both gain the same KE = qV. The proton ends up slower (greater mass) but KE is equal."},
{topic:"Particles",q:"Which of the following correctly describes the strong nuclear force?",opts:["It acts over distances of many metres","It is always repulsive","It is stronger than the electromagnetic force at ~1\u00a0fm","It acts between all particles that have mass"],ans:2,explain:"The strong force is very short range (<\u00a03\u00a0fm), attractive at ~1\u00a0fm and repulsive at shorter distances. It vastly exceeds electromagnetism at nuclear scales, binding protons together. It acts on hadrons only \u2014 not all massive particles."},
{topic:"Waves",q:"Light of wavelength 500\u00a0nm produces a second-order maximum at 30\u00b0 in a diffraction grating experiment. What is the slit spacing?",opts:["0.5\u00a0\u03bcm","1.0\u00a0\u03bcm","2.0\u00a0\u03bcm","4.0\u00a0\u03bcm"],ans:2,explain:"n\u03bb = d\u00a0sin\u03b8 \u2192 d = 2\u00d7500\u00d710\u207b\u2079\u00a0/\u00a0sin30\u00b0 = 2.0\u00d710\u207b\u2076\u00a0m = 2.0\u00a0\u03bcm. A common error is using n\u00a0=\u00a01 (first order) and obtaining half the correct answer."},
{topic:"Mechanics",q:"A ball of mass 2.0\u00a0kg is dropped from rest. What is its momentum after 3.0\u00a0s? (g = 9.81\u00a0m/s\u00b2)",opts:["19.6\u00a0kg\u00a0m/s","29.4\u00a0kg\u00a0m/s","58.9\u00a0kg\u00a0m/s","88.3\u00a0kg\u00a0m/s"],ans:2,explain:"v = gt = 9.81\u00d73.0 = 29.4\u00a0m/s. p = mv = 2.0\u00d729.4 = 58.9\u00a0kg\u00a0m/s. A common trap is quoting the velocity (29.4) as the answer without multiplying by mass."},
{topic:"Fields",q:"Which statement about electric field lines is correct?",opts:["Field lines can cross each other","Field lines point from negative to positive charge","A field line shows the direction a positive test charge would move","Field lines are always straight"],ans:2,explain:"By definition, field lines show the direction of force on a positive test charge \u2014 from positive to negative. They can never cross (would imply two field directions at one point). They can be curved, e.g. between two point charges."},
{topic:"Quantum & Nuclear",q:"A radioactive sample has an activity of 800\u00a0Bq. After three half-lives, what is its activity?",opts:["400\u00a0Bq","266\u00a0Bq","200\u00a0Bq","100\u00a0Bq"],ans:3,explain:"Each half-life halves the activity: 800 \u2192 400 \u2192 200 \u2192 100\u00a0Bq after three half-lives. The distractor 266\u00a0Bq comes from incorrectly dividing 800 by 3."},
{topic:"Particles",q:"The de Broglie wavelength of a particle is \u03bb. If its momentum doubles, what is the new wavelength?",opts:["2\u03bb","\u221a2\u00a0\u00d7\u00a0\u03bb","\u03bb/\u221a2","\u03bb/2"],ans:3,explain:"\u03bb = h/p. If p doubles, \u03bb = h/2p = \u03bb/2. The relationship is a direct inverse proportion \u2014 there is no square-root relationship."},
{topic:"Mechanics",q:"A uniform beam of weight W is pivoted at its centre. A load of 2W hangs from one end. What upward force must be applied at the other end to maintain equilibrium?",opts:["W/2","W","2W","3W"],ans:2,explain:"Moments about the pivot: clockwise = 2W\u00d7L, anticlockwise = F\u00d7L. Equating gives F = 2W. The beam\u2019s own weight acts through the pivot and contributes no moment, so it does not appear in the calculation."},
{topic:"Waves",q:"A wave has a speed of 330\u00a0m/s and wavelength 0.50\u00a0m. What is its period?",opts:["6.60\u00d710\u207b\u00b3\u00a0s","3.03\u00d710\u207b\u00b3\u00a0s","1.52\u00d710\u207b\u00b3\u00a0s","1.52\u00d710\u207b\u00b2\u00a0s"],ans:2,explain:"f = v/\u03bb = 330/0.50 = 660\u00a0Hz. T = 1/f = 1/660 = 1.52\u00d710\u207b\u00b3\u00a0s. Always find f first and then take the reciprocal \u2014 errors arise when trying to combine steps."},
{topic:"Mechanics",q:"Which of the following is a vector quantity?",opts:["Speed","Distance","Kinetic energy","Momentum"],ans:3,explain:"Momentum p = mv is a vector with both magnitude and direction. Speed, distance, and kinetic energy are all scalars. A frequent error is confusing velocity (vector) with speed (scalar)."},
{topic:"Mechanics",q:"The Young modulus of a material is defined as:",opts:["stress \u00d7 strain","strain / stress","stress / strain","force / extension"],ans:2,explain:"Young modulus E = stress / strain = (F/A) / (\u0394L/L). Force/extension is the spring constant k \u2014 a different quantity. Getting the ratio inverted is a very common exam error."},
{topic:"Electricity",q:"Two identical resistors are connected first in series, then in parallel across the same battery. How does the total power in the parallel arrangement compare to series?",opts:["The same","Double","Four times greater","Half"],ans:2,explain:"P_series = V\u00b2/2R. P_parallel = V\u00b2/(R/2) = 2V\u00b2/R. Ratio = 4. The parallel arrangement draws four times more power from the same battery \u2014 a result that surprises many students."},
{topic:"Mechanics",q:"A projectile is launched horizontally from height h. Which change would double the horizontal range?",opts:["Doubling the launch height h","Doubling the initial horizontal speed","Halving the initial horizontal speed","Doubling the mass"],ans:1,explain:"Range = u\u221a(2h/g). Doubling u doubles the range. Doubling h multiplies range by \u221a2 only. Mass has no effect (ignoring drag)."},
{topic:"Waves",q:"Two coherent waves, each of amplitude A, meet at a point with phase difference \u03c0. What is the resultant amplitude?",opts:["2A","\u221a2\u00a0\u00d7\u00a0A","A","Zero"],ans:3,explain:"A phase difference of \u03c0 (180\u00b0) gives complete destructive interference for equal-amplitude coherent waves \u2014 crests align with troughs and the resultant amplitude is zero."},
{topic:"Particles",q:"Which pair of particles are both hadrons?",opts:["Proton and electron","Neutron and neutrino","Proton and neutron","Electron and positron"],ans:2,explain:"Hadrons are composed of quarks. Protons and neutrons are both baryons \u2014 a subgroup of hadrons. Electrons, positrons, and neutrinos are all leptons, not hadrons."},
{topic:"Mechanics",q:"A skydiver reaches terminal velocity. Which statement is correct at that moment?",opts:["Acceleration is 9.81\u00a0m/s\u00b2 downward","The skydiver is no longer subject to gravity","Drag equals weight","The resultant force is downward"],ans:2,explain:"At terminal velocity, acceleration = 0, so resultant force = 0. Drag (upward) equals weight (downward). Gravity still acts \u2014 zero resultant force, not zero gravity, produces the constant speed."},
{topic:"Electricity",q:"A resistor and capacitor are connected in series with a battery. At the instant the circuit is closed, what is the current?",opts:["Zero, because the capacitor blocks DC","Maximum, determined by the resistor alone","Maximum, determined by the capacitor alone","EMF divided by total reactance"],ans:1,explain:"At t = 0, the uncharged capacitor has zero voltage across it, so all the EMF drives current through the resistor. Initial current = EMF/R. As the capacitor charges its voltage rises and current decays exponentially to zero."},
{topic:"Mechanics",q:"An object moves at constant velocity. Which statement must be true?",opts:["No forces act on the object","The object is stationary","All individual forces acting on it are zero","The resultant force on the object is zero"],ans:3,explain:"Newton\u2019s first law: constant velocity (including zero) requires zero resultant force. Individual forces may still act \u2014 they simply cancel. Option C is too strong: forces can exist and cancel rather than being individually zero."}
];
 
var current=0, score=0, answers=[];
for(var k=0;k<Qs.length;k++) answers.push(null);
 
var quizArea=document.getElementById("quiz-area");
var resultsArea=document.getElementById("results-area");
var progBar=document.getElementById("prog");
var progLabel=document.getElementById("prog-label");
var scorePill=document.getElementById("score-pill");
 
// Single delegated listener — no inline onclick needed
document.addEventListener("click", function(e){
  var t=e.target;
  while(t && t!==document){
    var a=t.getAttribute("data-action");
    if(a) break;
    t=t.parentElement;
  }
  if(!t || !t.getAttribute) return;
  var action=t.getAttribute("data-action");
  if(action==="choose"){
    handleChoice(parseInt(t.getAttribute("data-idx"),10));
  } else if(action==="prev"){
    if(current>0){current--;renderQ();}
  } else if(action==="next"){
    if(current<Qs.length){current++;renderQ();}
  } else if(action==="jump"){
    resultsArea.innerHTML="";
    current=parseInt(t.getAttribute("data-to"),10);
    renderQ();
  } else if(action==="restart"){
    for(var i=0;i<answers.length;i++) answers[i]=null;
    score=0; current=0;
    resultsArea.innerHTML="";
    renderQ();
  }
},false);
 
function handleChoice(idx){
  if(answers[current]!==null) return;
  answers[current]=idx;
  if(idx===Qs[current].ans) score++;
  updateMeta();
  renderQ();
}
 
function updateMeta(){
  var done=0;
  for(var i=0;i<answers.length;i++) if(answers[i]!==null) done++;
  progBar.style.width=(done/Qs.length*100)+"%";
  progLabel.textContent=current<Qs.length?"Question "+(current+1)+" of "+Qs.length:"Complete!";
  scorePill.textContent="Score: "+score+" / "+done;
}
 
function renderQ(){
  updateMeta();
  if(current>=Qs.length){renderResults();return;}
  var q=Qs[current];
  var answered=answers[current]!==null;
  var L=["A","B","C","D"];
  var opts="";
  for(var i=0;i<q.opts.length;i++){
    var cls="opt";
    if(answered){
      if(i===q.ans) cls+=" correct";
      else if(i===answers[current]) cls+=" wrong";
      else cls+=" dimmed";
    }
    opts+="<button class='"+cls+"' data-action='choose' data-idx='"+i+"'"+(answered?" disabled":"")+">"
         +"<span class='opt-letter'>"+L[i]+"</span><span>"+q.opts[i]+"</span></button>";
  }
  var fb="";
  if(answered){
    var ok=answers[current]===q.ans;
    fb="<div class='feedback "+(ok?"fb-correct":"fb-wrong")+"'><div class='fb-head'>"+(ok?"\u2713 Correct":"\u2717 Incorrect")+"</div><div>"+q.explain+"</div></div>";
  }
  var nxt=current<Qs.length-1
    ?"<button class='nav-btn primary' data-action='next'>Next \u2192</button>"
    :"<button class='nav-btn primary' data-action='next'>Finish \u2713</button>";
  quizArea.innerHTML=
    "<div class='topic-tag'>"+q.topic+"</div>"
   +"<div class='q-text'><strong>Q"+(current+1)+".</strong> "+q.q+"</div>"
   +"<div class='options'>"+opts+"</div>"
   +fb
   +"<div class='nav'>"
     +"<button class='nav-btn' data-action='prev'"+(current===0?" disabled":"")+">\u2190 Previous</button>"
     +"<span class='q-counter'>"+(current+1)+" / "+Qs.length+"</span>"
     +nxt
   +"</div>";
}
 
function renderResults(){
  quizArea.innerHTML="";
  var pct=Math.round(score/Qs.length*100);
  var grade,col;
  if(pct>=80){grade="Excellent \u2014 A/A* territory";col="var(--green)";}
  else if(pct>=65){grade="Good \u2014 likely a B/C";col="var(--amber)";}
  else if(pct>=50){grade="Needs work \u2014 C/D range";col="var(--amber)";}
  else{grade="Significant revision needed";col="var(--red)";}
  var dots="";
  for(var i=0;i<Qs.length;i++){
    var a=answers[i];
    var cls=a===null?"u":a===Qs[i].ans?"c":"w";
    dots+="<button class='dot "+cls+"' data-action='jump' data-to='"+i+"' title='Q"+(i+1)+": "+Qs[i].topic+"'>"+(i+1)+"</button>";
  }
  resultsArea.innerHTML=
    "<div class='results'>"
   +"<div class='results-score'>"+score+"<span>/"+Qs.length+"</span></div>"
   +"<div class='results-pct'>"+pct+"% correct</div>"
   +"<div class='results-grade' style='color:"+col+"'>"+grade+"</div>"
   +"<div class='breakdown'>"
     +"<div class='bd-card'><div class='bd-val green'>"+score+"</div><div class='bd-lbl'>Correct</div></div>"
     +"<div class='bd-card'><div class='bd-val red'>"+(Qs.length-score)+"</div><div class='bd-lbl'>Incorrect</div></div>"
     +"<div class='bd-card'><div class='bd-val'>"+pct+"%</div><div class='bd-lbl'>Score</div></div>"
   +"</div>"
   +"<div class='legend'>"
     +"<div class='legend-item'><div class='legend-dot' style='background:var(--green)'></div> Correct</div>"
     +"<div class='legend-item'><div class='legend-dot' style='background:var(--red)'></div> Incorrect</div>"
   +"</div>"
   +"<div class='dot-hint'>Click any dot to review that question</div>"
   +"<div class='dot-row'>"+dots+"</div>"
   +"<button class='restart-btn' data-action='restart'>Try Again</button>"
   +"</div>";
  progBar.style.width="100%";
  progLabel.textContent="Complete!";
}
 
renderQ();
}());
</script>
</body>
</html>
